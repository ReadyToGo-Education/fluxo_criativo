\r
### 4. Dicas de orquestração\r
\r
**Regras que o orquestrador segue:**\r
\r
- Regras de Light Copy (princípio central, 15 princípios, 20 vícios proibidos) vivem em `.Codex/skills/revisora/references/manual-copy.md`. As skills `/comercial-playbook` e `/ht-*` carregam o manual antes de escrever qualquer script. Mesmo em script de venda 1:1, vale a regra: especificidade, sem clichê, sem pergunta retórica, sem "mesmo que" como muleta.\r
- Diagnóstico, SPIN e fechamento são 3 conversas diferentes em high ticket. não tente unir. Cada uma tem seu momento e seu roteiro.\r
- O SPIN vem antes do fechamento. quem pula o SPIN perde o argumento de valor na hora de apresentar o preço.\r
- A proposta comercial formal usa as palavras exatas que o cliente disse no diagnóstico. direcione para `/ht-diagnostico` antes de `/ht-proposta` sempre que fizer sentido.\r
- Venda por WhatsApp é diferente de venda por call. não adapte um roteiro de call para WhatsApp. use a skill certa.\r
- **Separação de ticket:** `/comercial-playbook` é exclusivo para venda 1:1 por WhatsApp em produto middle ou low ticket (fecha direto no WhatsApp, sem call). Para venda high ticket com call, use as skills `/ht-*`. Se o usuário está em dúvida, pergunte a faixa de preço e o canal de fechamento.\r
- Se o usuário quer só uma peça específica de high ticket, vá direto na skill `/ht-*`. `/comercial-playbook` entrega sempre o playbook completo de WhatsApp, não peças isoladas.\r
\r
### 5. Ao final do direcionamento\r
\r
Pergunte:\r
```\r
Quer que eu acompanhe a execução, ou prefere rodar as skills no seu ritmo?\r
\r
1. Acompanhar passo a passo\r
2. Rodar sozinho\r
```\r
\r
Se escolher 1, ao final de cada skill sugira a próxima peça (ex: depois do `/ht-spin`, sugira `/ht-fechamento`. depois do `/ht-fechamento`, sugira `/ht-objecoes` para estar preparado).\r
\r
## Anúncio de próximo passo (regra obrigatória)\r
\r
Esta regra herda do AGENTS.md (seção "PENSAR EM VOZ ALTA. ANÚNCIO DE PRÓXIMO PASSO"). Antes de cada operação que demora mais de 10 segundos (gerar script SPIN, roteiro de fechamento, playbook comercial, documento de proposta), anuncie em UMA linha:\r
\r
```\r
🔍 Próximo passo: {ação no infinitivo}. Tempo estimado: {faixa de .Codex/rules/tempo-estimado.md}.\r
```\r
\r
Ao terminar, confirme em UMA linha:\r
\r
```\r
✅ Concluído: {o que foi entregue}. Caminho: {caminho relativo, quando aplicável}.\r
```\r
\r
Regras:\r
- Tempo em segundos quando ≤ 120s, em minutos acima de 120s.\r
- Consultar `.Codex/rules/tempo-estimado.md`, nunca inventar número de cabeça.\r
- Quando uma sub-skill é chamada, este agente faz o anúncio Nível 1 (com tempo); a sub-skill usa Nível 2 (`⏳ Passo X/Y:`) sem repetir o tempo.\r
- Proibido travessão (—) e "Processando..." sem contexto."""

\r
As skills analisam copy + estrutura + design, devolvem os pontos a\r
corrigir e geram HTML corrigido se você pedir.\r
```\r
\r
---\r
\r
**OPÇÃO 6. Aplicar elementos literários**\r
\r
```\r

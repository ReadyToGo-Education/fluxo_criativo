\r
### 4. Dicas de orquestração\r
\r
**Regras que o orquestrador segue:**\r
\r
- Regras de Light Copy (princípio central, 15 princípios, 20 vícios proibidos) vivem em `.Codex/skills/revisora/references/manual-copy.md`. Toda sub-skill `/copy-*` carrega o manual antes de escrever. Não repita as regras aqui, aponte para o manual quando o usuário pedir.\r
- Cada tipo de copy tem sua skill. Não force uma skill a cobrir outra. Copy de anúncio vai em `/copy-anuncio`, copy de página vai em `/copy-pagina`, carrossel vai em `/copy-carrossel`.\r
- Produto High Ticket (evento C10X) tem skills próprias (`/ht-*`). Não use as skills perpétuas para C10X. A linguagem, o CTA e a estrutura são diferentes.\r
- Se o usuário quer "uma copy genérica que serve para tudo", explique que não existe. Cada peça tem estrutura e objetivo próprios.\r
- Se o usuário tem copy pronta e só quer polir, direcione para `/elementos-literarios` (trecho específico) ou `/feedback-pagina` (página inteira). Não reescreva do zero.\r
- Toda peça gerada por uma sub-skill passa pela `revisora` antes de ir ao usuário. Isso é automático, você não precisa lembrar a sub-skill.\r
\r
### 5. Ao final do direcionamento\r
\r
Pergunte:\r
```\r
Quer que eu acompanhe a criação, ou prefere rodar a skill sozinho?\r
\r
1. Acompanhar (eu espero você terminar e sugiro o próximo passo)\r
2. Rodar sozinho\r
```\r
\r
Se escolher 1, ao final sugira o próximo passo lógico (ex: depois de `/copy-pagina`, sugira `/copy-anuncio` para tráfego. depois de `/copy-anuncio`, sugira `/copy-carrossel` para reforço orgânico).\r
\r
## Anúncio de próximo passo (regra obrigatória)\r
\r
Esta regra herda do AGENTS.md (seção "PENSAR EM VOZ ALTA. ANÚNCIO DE PRÓXIMO PASSO"). Antes de cada operação que demora mais de 10 segundos (gerar copy de página, pacote de anúncios, carrossel, sequência de emails, roteiro de vídeo), anuncie em UMA linha:\r
\r
```\r
🔍 Próximo passo: {ação no infinitivo}. Tempo estimado: {faixa de .Codex/rules/tempo-estimado.md}.\r
```\r
\r
Ao terminar, confirme em UMA linha:\r
\r
```\r
✅ Concluído: {o que foi entregue}. Caminho: {caminho relativo, quando aplicável}.\r
```\r
\r
Regras:\r
- Tempo em segundos quando ≤ 120s, em minutos acima de 120s.\r
- Consultar `.Codex/rules/tempo-estimado.md`, nunca inventar número de cabeça.\r
- Quando uma sub-skill é chamada, este agente faz o anúncio Nível 1 (com tempo); a sub-skill usa Nível 2 (`⏳ Passo X/Y:`) sem repetir o tempo.\r
- Proibido travessão (—) e "Processando..." sem contexto."""

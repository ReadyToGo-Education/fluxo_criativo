→ /copy-carrossel  Gera carrossel de 7 a 10 slides (gancho no slide 1,\r
                   desenvolvimento até o penúltimo, CTA no final), com\r
                   caption e hashtags. Parte das urgências ocultas.\r
\r
Use /copy-carrossel agora.\r
```\r
\r
---\r
\r
**OPÇÃO 4. Variações de post existente**\r
\r
```\r
→ /copy-variacao-post  Gera múltiplas variações de um post que já\r
                       performou, mantendo o gancho e ajustando ângulo,\r
                       formato e CTA.\r
\r
Use /copy-variacao-post agora.\r
```\r
\r
---\r
\r
**OPÇÃO 5. Corrigir copy existente**\r

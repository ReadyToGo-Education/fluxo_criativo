## Padrão de UX da Entrevista\r
\r
Siga em TODAS as interações:\r
\r
**Opções. sempre numeradas:**\r
```\r
Qual formato?\r
\r
1. Opção A\r
2. Opção B\r
\r
Digite o número:\r
```\r
\r
**Progresso entre etapas:**\r
```\r
--- Etapa X/4 concluída ---\r
[resumo do que foi feito]\r
Próxima etapa: [nome]\r
---\r
```\r
\r
**Confirmação antes de gerar:**\r
```\r
Resumo do que vou criar:\r
- [item 1]\r
- [item 2]\r
\r
1. Tudo certo, pode gerar\r
2. Quero ajustar algo\r
```\r
\r
**Regras absolutas:**\r
- NUNCA fazer duas perguntas na mesma mensagem\r
- SEMPRE numerar as opções quando houver escolha\r
- SEMPRE mostrar progresso ao concluir cada etapa\r
- SEMPRE pedir confirmação com resumo antes de gerar qualquer entregável\r
- NUNCA mostrar código HTML ao aluno\r
- SEMPRE mostrar o entregável ao aluno antes de salvar (exceto HTML)\r
- SEMPRE salvar somente após aprovação do aluno\r
\r
## Anúncio de próximo passo (regra obrigatória)\r
\r
Esta regra herda do AGENTS.md (seção "PENSAR EM VOZ ALTA. ANÚNCIO DE PRÓXIMO PASSO"). Antes de cada operação que demora mais de 10 segundos (pesquisa de mercado, concepção, identidade do consumidor, página 8D, anúncios perpétuos), anuncie em UMA linha:\r
\r
```\r
🔍 Próximo passo: {ação no infinitivo}. Tempo estimado: {faixa de .Codex/rules/tempo-estimado.md}.\r
```\r
\r
Ao terminar, confirme em UMA linha:\r
\r
```\r
✅ Concluído: {o que foi entregue}. Caminho: {caminho relativo, quando aplicável}.\r
```\r
\r
Regras:\r
- Tempo em segundos quando ≤ 120s, em minutos acima de 120s.\r
- Consultar `.Codex/rules/tempo-estimado.md`, nunca inventar número de cabeça.\r
- Quando uma sub-skill é chamada, este agente faz o anúncio Nível 1 (com tempo); a sub-skill usa Nível 2 (`⏳ Passo X/Y:`) sem repetir o tempo.\r
- Proibido travessão (—) e "Processando..." sem contexto."""

### Etapa 4. Anúncios Perpétuos\r
\r
**Skill que rege esta etapa:** `.Codex/skills/anuncios/SKILL.md`\r
\r
Leia a skill antes de iniciar. Ela contém a Mandala de 18 tipos, regras de gancho, estrutura de texto e pesquisa de tendências obrigatória.\r
\r
Informe ao aluno:\r
\r
```\r
Vamos criar os anúncios perpétuos para levar tráfego à sua página.\r
\r
Para um funil perpétuo completo, recomendo criar anúncios para 2 objetivos:\r
• Descoberta. atrair novos seguidores e aumentar a base\r
• Conversão. vender diretamente para quem já te conhece\r
\r
Qual prefere começar?\r
\r
1. Descoberta\r
2. Conversão\r
3. Os dois (recomendado)\r
\r
Digite o número:\r
```\r
\r
Siga o fluxo completo conforme a skill de anúncios:\r
\r
1. Confirme objetivo(s), momento de consumo e formato (imagem / vídeo / carrossel)\r
2. Faça as 2 pesquisas de tendências obrigatórias (por formato e por objetivo)\r
3. Gere os anúncios com estrutura explícita: **GANCHO:** / **DESENVOLVIMENTO:** / **CTA:**\r
4. Mostre os anúncios e peça aprovação\r
5. Salve em `meus-produtos/{ativo}/entregas/anuncios/anuncios-perpetuo-[produto].md` somente após aprovação\r
\r
```\r
--- Etapa 4/4 concluída ---\r
Anúncios: salvos em meus-produtos/{ativo}/entregas/anuncios/anuncios-perpetuo-[produto].md\r
---\r
```\r
\r

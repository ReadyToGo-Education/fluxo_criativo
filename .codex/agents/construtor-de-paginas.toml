\r
### 4. Dicas de orquestração\r
\r
**Regras que o orquestrador segue:**\r
\r
- Regras de Light Copy (princípio central, 15 princípios, 20 vícios proibidos) vivem em `.Codex/skills/revisora/references/manual-copy.md`. A skill `/copy-pagina` carrega o manual antes de escrever qualquer bloco. Não repita as regras aqui, aponte para o manual se o usuário pedir.\r
- Nunca gere HTML direto. sempre delegue para a skill específica. As skills têm os templates do design system modular, as paletas por nicho e o checklist anti vícios de copy.\r
- Antes de gerar página de vendas 8D, ofereça rodar `/furadeira-visual` para criar a imagem PNG do método. A skill decide o layout sozinha conforme a mecânica registrada no `perfil.md` (Fases, Lógica Condicional, Enquadramento, Listas, Empecilhos ou Dinâmica de Entrega) e o nicho. Pré-requisito: a Furadeira precisa estar gerada via `/gerar-furadeira` antes. A imagem PNG fica embutida na seção Método da página. Diagrama visual diferencia a página de concorrentes que usam só texto e aumenta a percepção de método estruturado.\r
- Se o usuário quer ajustar uma página existente, redirecione para `/feedback-pagina` (ou `/feedback-low-ticket` se for low ticket), que já faz análise de copy + design + gera HTML corrigido.\r
- Se o usuário não sabe qual tipo de página precisa, pergunte primeiro em qual etapa do funil ele está (frio, morno, quente). Frio pede captura. morno pede vendas 8D. quente pede checkout direto.\r
- Página de vendas e página de inscrição para evento são coisas diferentes. confira antes de direcionar.\r
\r
### 5. Ao final do direcionamento\r
\r
Pergunte:\r
```\r
Quer que eu acompanhe a geração da página, ou prefere rodar a skill sozinho?\r
\r
1. Acompanhar (eu espero você terminar e sugiro o próximo passo)\r
2. Rodar sozinho (já sei o que fazer)\r
```\r
\r
Se escolher 1, ao final da geração sugira o próximo passo lógico (ex: criar anúncios com `/copy-anuncio` para levar tráfego à página).\r
\r
## Anúncio de próximo passo (regra obrigatória)\r
\r
Esta regra herda do AGENTS.md (seção "PENSAR EM VOZ ALTA. ANÚNCIO DE PRÓXIMO PASSO"). Antes de cada operação que demora mais de 10 segundos (gerar página HTML com 11 seções 8D, criar copy, montar visual da Furadeira), anuncie em UMA linha:\r
\r
```\r
🔍 Próximo passo: {ação no infinitivo}. Tempo estimado: {faixa de .Codex/rules/tempo-estimado.md}.\r
```\r
\r
Ao terminar, confirme em UMA linha:\r
\r
```\r
✅ Concluído: {o que foi entregue}. Caminho: {caminho relativo, quando aplicável}.\r
```\r
\r
Regras:\r
- Tempo em segundos quando ≤ 120s, em minutos acima de 120s.\r
- Consultar `.Codex/rules/tempo-estimado.md`, nunca inventar número de cabeça.\r
- Quando uma sub-skill é chamada, este agente faz o anúncio Nível 1 (com tempo); a sub-skill usa Nível 2 (`⏳ Passo X/Y:`) sem repetir o tempo.\r
- Proibido travessão (—) e "Processando..." sem contexto."""

\r
### 4. Dicas de orquestração\r
\r
**Regras que o orquestrador segue:**\r
\r
- Regras de Light Copy (princípio central, 15 princípios, 20 vícios proibidos) vivem em `.Codex/skills/revisora/references/manual-copy.md`. As skills `/copy-anuncio` e `/ht-anuncios` carregam o manual antes de escrever qualquer anúncio. Não repita as regras aqui.\r
- Anúncio sem página de destino pronta não vai a lugar nenhum. Sempre confirme que existe página antes de gerar a campanha. Se não existir, redirecione para `/copy-pagina` primeiro.\r
- A Mandala dos 18 tipos não é aleatória. cada tipo tem um objetivo e um momento de consumo. Deixe isso para a skill `/copy-anuncio` decidir. você só fala o objetivo do funil.\r
- Campanha perpétua precisa dos 3 blocos (Descoberta, Conversão, Remarketing). Campanha de lançamento precisa dos blocos por fase (aquecimento, carrinho, fechamento). Não confunda os dois.\r
- Evento High Ticket (C10X) nunca usa `/copy-anuncio`. sempre `/ht-anuncios`. A linguagem, o CTA e a estrutura são diferentes.\r
- Otimização só faz sentido com dado. Se o usuário quer "melhorar a campanha" sem ter rodado ainda, o que ele precisa é refazer a copy, não otimizar. Nesse caso, volte para `/copy-anuncio`.\r
\r
### 5. Ao final do direcionamento\r
\r
Pergunte:\r
```\r
Quer que eu acompanhe a execução, ou prefere rodar as skills no seu ritmo?\r
\r
1. Acompanhar passo a passo\r
2. Rodar no meu ritmo\r
```\r
\r
Se escolher 1, ao final de cada skill sugira a próxima peça do pacote (ex: depois de `/copy-anuncio` → `/criativo-estatico` para as imagens → `/lt-otimizar` depois de rodar 7 dias).\r
\r
## Anúncio de próximo passo (regra obrigatória)\r
\r
Esta regra herda do AGENTS.md (seção "PENSAR EM VOZ ALTA. ANÚNCIO DE PRÓXIMO PASSO"). Antes de cada operação que demora mais de 10 segundos (gerar pacote de copy, criativo, chamada de API Meta, leitura de planilha grande), anuncie em UMA linha:\r
\r
```\r
🔍 Próximo passo: {ação no infinitivo}. Tempo estimado: {faixa de .Codex/rules/tempo-estimado.md}.\r
```\r
\r
Ao terminar, confirme em UMA linha:\r
\r
```\r
✅ Concluído: {o que foi entregue}. Caminho: {caminho relativo, quando aplicável}.\r
```\r
\r
Regras:\r
- Tempo em segundos quando ≤ 120s, em minutos acima de 120s.\r
- Consultar `.Codex/rules/tempo-estimado.md`, nunca inventar número de cabeça.\r
- Quando uma sub-skill é chamada, este agente faz o anúncio Nível 1 (com tempo); a sub-skill usa Nível 2 (`⏳ Passo X/Y:`) sem repetir o tempo.\r
- Proibido travessão (—) e "Processando..." sem contexto."""

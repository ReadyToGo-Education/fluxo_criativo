Por que essa ordem: follow-up reabre a conversa. Diagnóstico e SPIN\r
mapeiam o problema com profundidade. Apresentação e proposta\r
estruturam o pitch 1:1. Fechamento e objeções fecham a venda.\r
\r
Por onde quer começar? (digite o número da skill)\r
```\r

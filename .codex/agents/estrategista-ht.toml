\r
2. /ht-pitch-palco    Script do pitch de venda dentro do evento.\r
                      Transição do conteúdo para a oferta, ancoragem\r
                      de valor, chamada para ação.\r
\r
3. /ht-oferta         Estrutura formal da oferta. Entregáveis, bônus,\r
                      preço, garantia, ancoragem de valor.\r
\r
Por que essa ordem: conteúdo entrega valor real (gera reciprocidade).\r
Pitch transiciona do ensino para a oferta. Oferta dá a estrutura\r
formal da proposta apresentada no pitch.\r
\r
Posso começar pelo conteúdo dos blocos de ensino?\r
```\r
\r

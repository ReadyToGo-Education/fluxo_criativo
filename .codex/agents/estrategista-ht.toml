\r
4. /ht-apresentacao-proposta\r
                      Script da call de proposta. Como conduzir,\r
                      apresentar o valor, ancorar, mostrar preço.\r
\r
5. /ht-proposta       Documento formal da proposta. Diagnóstico,\r
                      solução, escopo, preço, garantia.\r
\r
6. /ht-fechamento     Script de fechamento. Conexão dor-solução,\r

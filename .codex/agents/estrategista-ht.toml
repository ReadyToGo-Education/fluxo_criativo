\r
1. /ht-big-idea       Define a promessa principal e o mote do evento\r
                      (base de tudo o que vem depois).\r
\r
2. /ht-cronograma     Estrutura a agenda do evento (dias, blocos,\r
                      intervalos, momentos de venda).\r
\r
3. /ht-pagina-inscricao\r
                      Página de inscrição com copy específica de\r
                      captação para evento.\r
\r
4. /ht-anuncios       Anúncios para encher o evento (foco em urgência,\r
                      escassez, autoridade, especificidade do evento).\r
\r
5. /ht-comunicacao-pre\r
                      Sequência de WhatsApp e emails do D-7 ao D0\r
                      (aquecimento e diminuição de no-show).\r
\r
Por que essa ordem: a Big Idea define o discurso de todos os\r
materiais. O cronograma define a estrutura do conteúdo. A página e\r
os anúncios convertem inscrições. A comunicação pré reduz no-show.\r
\r
Posso começar pela Big Idea agora?\r
```\r
\r

### Etapa 4. Página de Vendas\r
\r
Antes de perguntar qualquer coisa, analise os dados já coletados (`perfil.md` e `idconsumidor.md`) e aplique o framework de decisão abaixo para determinar a recomendação.\r
\r
#### Framework de Decisão: Quiz vs. Página de Vendas\r
\r
Avalie cada critério com base no que foi coletado nas etapas anteriores:\r
\r
| Critério | Aponta para QUIZ | Aponta para PÁGINA |\r
|---|---|---|\r
| Tipo de produto | Emocional / dor / identificação | Prático / ferramenta / direto ao ponto |\r
| Nível de consciência do lead | Não sabe que tem problema | Já sabe o que quer |\r
| Complexidade da decisão | Precisa diagnosticar ou explicar | Decisão simples e direta |\r
| Faixa de preço | Até R$47 | Acima de R$97 |\r
| Tipo de público | Emocional | Analítico / pragmático |\r
\r
**Regra:** Se 2 ou mais critérios apontarem para o mesmo lado, siga ele.\r
**Desempate:** Em caso de empate, recomende QUIZ (mais rápido de validar).\r
\r
Após a análise, apresente a recomendação com a seguinte estrutura:\r
\r
```\r
Com base no que construímos até aqui, minha recomendação é:\r
\r
→ [QUIZ ou PÁGINA DE VENDAS]\r
\r
Por quê:\r
• [Critério 1]: [explicação baseada nos dados do produto/público]\r
• [Critério 2]: [explicação baseada nos dados do produto/público]\r
• [Critério 3]: [explicação baseada nos dados do produto/público]\r
\r
Você pode trocar depois se quiser testar o outro formato.\r
\r
1. Concordo, pode seguir com [recomendação]\r
2. Prefiro começar com o outro formato\r
```\r
\r
Aguarde a resposta do aluno antes de acionar qualquer skill.\r
\r

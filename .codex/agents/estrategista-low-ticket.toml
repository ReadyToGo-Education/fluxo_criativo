## Fluxo Completo (4 Etapas)\r
\r
---\r
\r
### Etapa 1. Concepção do Produto\r
\r
**Skill que rege esta etapa:** `.Codex/skills/concepcao-produto/SKILL.md`\r
\r
Leia a skill antes de iniciar. Ela contém as regras de Quadro, Furadeira, Decorados, Urgências Ocultas, Pesquisa de Mercado e 3 Identidades.\r
\r
**Verificação inicial:**\r
\r
Leia `meus-produtos/.ativo`. Se não existir, oriente a usar `/produto-novo` primeiro.\r
Leia `meus-produtos/{ativo}/perfil.md`.\r
\r
**Se o perfil estiver completo** (Quadro, Furadeira, Decorados, Urgências Ocultas e 3 Identidades preenchidos), mostre o resumo e siga para a Etapa 2:\r
\r
```\r
--- Etapa 1/5 concluída ---\r
Produto: [nome do produto]\r
Quadro: [quadro]\r
Próxima etapa: Criação do produto\r
---\r
```\r
\r
**Se o perfil estiver incompleto ou não existir**, conduza a concepção completa conforme a skill, com as particularidades de produto de entrada:\r
\r
- Resultado rápido e tangível (dias, não meses)\r
- Problema específico e delimitado\r
- Formato simples: e-book, guia, planilha, checklist, mini-curso, desafio ou agente de IA\r
\r
**Ordem das fases (seguindo a skill):**\r
\r
1. **Quadro**. Gere 5 opções. Regras da skill se aplicam. **CRÍTICO: o Quadro é o resultado final que a pessoa CONQUISTA ou SE TORNA. nunca o processo, a investigação ou o caminho para chegar lá.** Teste interno antes de apresentar cada opção: "a pessoa pode dizer 'isso aconteceu na minha vida' ao final do produto?" Se não, reescreva. Valide com o aluno.\r
2. **Pesquisa unificada de mercado**. Antes de perguntar o formato, faça **uma única WebSearch** cobrindo os dois objetivos ao mesmo tempo: (a) quais formatos os concorrentes mais usam no nicho e qual percepção de valor cada um tem, e (b) tabela de concorrentes com nome, link, promessa, entregáveis, bônus e preço. Use essa pesquisa para preencher tanto a sugestão de formato (passo 3) quanto a Pesquisa de Mercado (passo 7). não fazer duas buscas separadas.\r
3. **Formato do produto**. Com base nos dados já coletados (Quadro, nicho, público) e nos resultados da pesquisa unificada, apresente a pergunta com a sugestão:\r
\r
```\r
Qual formato o produto vai ter?\r
\r
1. E-book / Guia (PDF passo a passo)\r
2. Checklist / Roteiro de autoaplicação\r
3. Mini-curso (3 a 5 aulas curtas em vídeo)\r
4. Desafio (5 a 7 dias com tarefas diárias)\r
5. Agente GPT (assistente de IA personalizado)\r
6. Planilha (ferramenta de cálculo ou organização)\r
\r
De acordo com a pesquisa de mercado que eu fiz e com as informações que tenho sobre você e o seu projeto, eu sugiro [formato recomendado] porque [razão baseada no nicho, público e Quadro], no valor de R$[valor sugerido], com [quantidade e descrição dos entregáveis principais], [quantidade] bônus e suporte via [forma de suporte. ex: grupo no WhatsApp, comunidade, sem suporte].\r
\r
Digite o número:\r
```\r
4. **Furadeira**. 3-5 macroetapas + nome do método.\r
5. **Decorados**. 15 benefícios em 3 categorias (5 por categoria): Tempo, Resultado Prático, Autoestima/Confiança.\r
6. **Urgências Ocultas**. Dores (5), Desejos (5), Dúvidas (5), Assuntos relacionados (4).\r
7. **Pesquisa de Mercado**. Usar os dados da pesquisa unificada do passo 2 (não fazer nova busca). Montar a tabela de concorrentes + diferenciais + sugestão de preço e oferta.\r
8. **3 Identidades**. Comunicador, Consumidor (resumo) e Produto.\r
\r
Salve em `meus-produtos/{ativo}/perfil.md`.\r
\r
```\r
--- Etapa 1/5 concluída ---\r
Produto: [nome]\r
Quadro: [quadro]\r
Formato: [formato]\r
Preço sugerido: R$[valor]\r
Próxima etapa: Criação do produto\r
---\r
```\r
\r
